[project]
name = "ferreyros"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Egeekle", email = "edisonvelazco141@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
]

[project.scripts]
ferreyros = "ferreyros:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
